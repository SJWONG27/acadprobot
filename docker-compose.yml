services:
  # --- FastAPI Backend ---
  backend:
    build: ./backend
    platform: linux/amd64
    container_name: acadprobot-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - spring-service
    networks:
      - acadprobot-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always 

  # --- Spring Boot Service ---
  spring-service:
    build: ./spring-service
    container_name: acadprobot-spring
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - acadprobot-network
    restart: always 

  # --- Redis Stream Queue ---
  redis:
    image: redis:7-alpine
    container_name: acadprobot-redis
    ports:
      - "6379:6379"
    networks:
      - acadprobot-network
    volumes:
      - redis-data:/data
    restart: always

  # --- React Frontend ---
  frontend:
    build: ./frontend
    container_name: acadprobot-frontend
    ports:
      - "5173:80"  # optional: use 5173 externally, but Nginx runs on 80 internally
    depends_on:
      - backend
    networks:
      - acadprobot-network
    restart: always 
  
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    networks:
      - acadprobot-network
    volumes:
      - ollama-data:/root/.ollama

networks:
  acadprobot-network:
    driver: bridge

volumes:
  ollama-data:
  redis-data:
